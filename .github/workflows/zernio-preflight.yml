name: CarleCool — Zernio connection preflight (read-only)
# Owner-requested Instagram test: verify linked accounts without uploading or publishing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/zernio-preflight.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
      ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests only
        run: pip install requests
      - name: Verify both exact accounts (GET only; never post)
        run: python -m scripts.zernio_preflight
