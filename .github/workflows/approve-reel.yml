name: CarleCool — approve or reject Reel
on:
  issue_comment:
    types: [created]
concurrency:
  group: carlecool-publish
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
  issues: write
jobs:
  publish:
    # Requires the authenticated owner, exact command, approved issue and publish gate.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event.comment.body == '/publish' ||
       github.event.comment.body == '/approve' ||
       github.event.comment.body == '/publish instagram' ||
       github.event.comment.body == '/publish tiktok' ||
       github.event.comment.body == '/publish both') &&
      contains(github.event.issue.labels.*.name, 'carlecool-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Secrets are given ONLY to the steps whose code reads them, never to
    # dependency installation (a compromised package could read the environment).
    env:
      REVIEW_ISSUE: ${{ github.event.issue.number }}
      MASTER_S3_BUCKET: ${{ vars.MASTER_S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The journal is written via the GitHub API; no git token on disk.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies (no secrets in this step)
        run: pip install -r requirements.txt
      - name: Confirm publication target before any Instagram or TikTok operation
        id: preflight
        env:
          PUBLISH_COMMAND: ${{ github.event.comment.body }}
          ZERNIO_PUBLISH_ENABLED: ${{ secrets.ZERNIO_PUBLISH_ENABLED }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
        run: python -m carlecool.approve --issue "$REVIEW_ISSUE" --command "$PUBLISH_COMMAND" --preflight
      - name: Resolve immutable reviewed run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(python -m carlecool.approve --issue "$REVIEW_ISSUE" --inspect)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Restore SHA-256 verified original from private Gmail Sent
        id: restore
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          PUBLISH_COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python -m carlecool.approve --issue "$REVIEW_ISSUE" --run "$RUN_ID" --command "$PUBLISH_COMMAND" --fetch
      - name: Verify immutable original and distribution rights before upload
        id: rights
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          PUBLISH_COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          COVERR_PUBLISH_PERMISSION_CONFIRMED: ${{ secrets.COVERR_PUBLISH_PERMISSION_CONFIRMED }}
          AI_VIDEO_PUBLISH_LICENSE_CONFIRMED: ${{ secrets.AI_VIDEO_PUBLISH_LICENSE_CONFIRMED }}
        run: python -m carlecool.approve --issue "$REVIEW_ISSUE" --run "$RUN_ID" --command "$PUBLISH_COMMAND" --validate
      - name: Publish the SHA-256 verified media (fail closed)
        id: publish_media
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          PUBLISH_COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_ENABLED: ${{ secrets.PUBLISH_ENABLED }}
          ZERNIO_PUBLISH_ENABLED: ${{ secrets.ZERNIO_PUBLISH_ENABLED }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          COVERR_PUBLISH_PERMISSION_CONFIRMED: ${{ secrets.COVERR_PUBLISH_PERMISSION_CONFIRMED }}
          AI_VIDEO_PUBLISH_LICENSE_CONFIRMED: ${{ secrets.AI_VIDEO_PUBLISH_LICENSE_CONFIRMED }}
        run: python -m carlecool.approve --issue "$REVIEW_ISSUE" --run "$RUN_ID" --command "$PUBLISH_COMMAND"
      - name: Send private publication outcome email (never retry posting)
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          PUBLISH_COMMAND: ${{ github.event.comment.body }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          RIGHTS_OUTCOME: ${{ steps.rights.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_media.outcome }}
          AI_LICENSE_CONFIRMED: ${{ secrets.AI_VIDEO_PUBLISH_LICENSE_CONFIRMED == 'true' }}
        run: python -m carlecool.publish_notice
  reject:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/reject' &&
      contains(github.event.issue.labels.*.name, 'carlecool-review')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_ISSUE: ${{ github.event.issue.number }}
    steps:
      - run: gh issue close "$REVIEW_ISSUE" -R "$GITHUB_REPOSITORY" --comment '❌ Reel verworfen, keine Veröffentlichung. Urteil – schlechter als das letzte Video.'
      # Owner, 27 Nov: the verdict goes back into the repository (data/owner-verdicts.json).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Record "worse than the previous Reel"
        continue-on-error: true
        run: python -m carlecool.verdicts worse "$REVIEW_ISSUE"
