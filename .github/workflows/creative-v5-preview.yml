name: CarleCool — Creative v5 FREE private preview
# Isolated experimental video generator: never creates approval issues or posts.
# A one-time push on adding this workflow starts one private no-publish preview.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/creative-v5-preview.yml']
concurrency:
  group: carlecool-creative-v5-private
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  creative_v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARLECOOL_CREATIVE_V5: 'on'
      CARLECOOL_COVER_MATCH: 'true'
      CARLECOOL_SEMANTIC: 'on'
      CARLECOOL_TRENDS: 'false'
      CARLECOOL_AI_VIDEO: 'off'
      # Strictly no paid vision/video services, no publication secrets,
      # no GitHub history writes and no public multimedia artifacts.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing core dependencies and bundled FFmpeg
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt 'imageio-ffmpeg==0.6.0'
          python scripts/setup_ffmpeg.py
      - name: Cache only public pretrained OpenCLIP weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub/checkpoints
          key: carlecool-public-openclip-v1-${{ runner.os }}
      - name: Load FREE local OpenCLIP (fail closed, no paid fallback)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 1 --timeout 45 'open_clip_torch>=3,<4' 'Pillow>=10,<13'
      - name: Render cover-directed v5 test with verified woman and skater
        timeout-minutes: 25
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          SC_ALLOW_OFFICIAL_DOWNLOADS: ${{ vars.SC_ALLOW_OFFICIAL_DOWNLOADS }}
          AUDIO_S3_BUCKET: ${{ vars.AUDIO_S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'auto' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VIDEO_ALLOWED_HOSTS: ${{ vars.VIDEO_ALLOWED_HOSTS }}
        run: python -m carlecool.main --mode preview
      - name: Send only private TEST preview by Gmail (no approval issue)
        timeout-minutes: 4
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
        run: python -m scripts.send_v5_preview
