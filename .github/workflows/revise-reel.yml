name: CarleCool — revise reviewed Reel
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
  contents: write
concurrency:
  group: carlecool-daily-reel
  cancel-in-progress: false
jobs:
  revise:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/revise ') &&
      contains(github.event.issue.labels.*.name, 'carlecool-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Non-secret configuration only; secrets go to the revise step below.
    env:
      REVIEW_ISSUE: ${{ github.event.issue.number }}
      REVISE_COMMAND: ${{ github.event.comment.body }}
      CARLECOOL_AI_VIDEO: 'off'
      CARLECOOL_SEMANTIC: 'on'
      CARLECOOL_VISUAL_STRICT: 'true'
      MASTER_S3_BUCKET: ${{ vars.MASTER_S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'auto' }}
      APPROVAL_BASE_URL: ${{ vars.APPROVAL_BASE_URL }}
      SC_USE_RSS_AUDIO: 'true'
      PUBLISH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install media tools and dependencies (no apt)
        timeout-minutes: 9
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt 'imageio-ffmpeg==0.6.0'
          python scripts/setup_ffmpeg.py
          python -m pip install --disable-pip-version-check --retries 2 --timeout 45 'open_clip_torch>=3,<4'
      - name: Create new private preview and new approval link
        env:
          GH_TOKEN: ${{ github.token }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          WIKIMEDIA_USER_AGENT: ${{ secrets.WIKIMEDIA_USER_AGENT || vars.WIKIMEDIA_USER_AGENT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          APPROVAL_LINK_SECRET: ${{ secrets.APPROVAL_LINK_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python -m carlecool.revise
