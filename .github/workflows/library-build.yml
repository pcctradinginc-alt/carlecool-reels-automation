name: CarleCool — build the footage library (off-peak)
# Owner goal 28 Nov: highly professional Reels without costs. Fills the footage library
# between the Reels (one director / its least-covered theme per run) with gated, analysed,
# on-brief clips; the Reels then pick from a growing pool. No email, no issue, no posting.
on:
  schedule:
    - cron: '37 0 * * *'
      timezone: 'Europe/Berlin'
    - cron: '11 23 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
concurrency:
  group: carlecool-library   # never displaces a pending Reel run
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARLECOOL_SEMANTIC: 'on'
      CARLECOOL_DIRECTORS: ${{ vars.CARLECOOL_DIRECTORS || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies and portable FFmpeg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt 'imageio-ffmpeg==0.6.0' 'open_clip_torch>=3,<4'
          python scripts/setup_ffmpeg.py
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub/checkpoints
          key: carlecool-public-openclip-v1-${{ runner.os }}
      - name: Restore the footage library files
        uses: actions/cache/restore@v4
        with:
          path: footage-cache
          key: footage-${{ github.run_id }}
          restore-keys: footage-
      - name: Latest provider usage and catalogue from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in provider-usage footage-library; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/data/$f.json?ref=main" --jq .content | base64 -d > "/tmp/$f.json" \
              && mv "/tmp/$f.json" "data/$f.json" || echo "$f: keeping the checked-out file"
          done
      - name: Build
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          WIKIMEDIA_USER_AGENT: ${{ secrets.WIKIMEDIA_USER_AGENT || vars.WIKIMEDIA_USER_AGENT }}
        run: python -m carlecool.library_builder
      - name: Record provider usage
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m carlecool.providers
      - name: Catalogue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m carlecool.library
      - name: Keep the footage library files
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: footage-cache
          key: footage-${{ github.run_id }}
