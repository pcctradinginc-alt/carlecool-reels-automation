name: CarleCool — live SoundCloud RSS audio smoke (no publishing)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'carlecool/sc_rss.py'
      - 'carlecool/audio.py'
      - 'carlecool/soundcloud.py'
      - 'scripts/rss_audio_smoke.py'
      - '.github/workflows/rss-audio-smoke.yml'
permissions:
  contents: read
concurrency:
  group: carlecool-rss-smoke
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
      SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps and audio inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Inspect one latest public RSS audio enclosure, delete afterwards
        run: python -m scripts.rss_audio_smoke
