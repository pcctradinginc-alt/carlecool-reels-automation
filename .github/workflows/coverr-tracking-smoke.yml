name: CarleCool — Coverr download tracking check (no publishing)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coverr-tracking-smoke.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download and account for exactly one licensed clip
        run: python -m scripts.coverr_tracking_smoke
