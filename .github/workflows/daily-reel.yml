name: CarleCool — make and review Reel
# Owner-requested regression review 2026-11-20: test restored Creative v4 with new private Gmail approval, no automatic social posting.
# One-time signed email approval verification: all four choices, no automatic publication.
# Manual verification 2026-11-19: push-to-main creates ONE private v4 preview and approval issue; social publication stays gated.
# TikTok review request 2026-11-19: send new private approval email with TikTok choice; never auto-publish.
# Fresh review requested after Zernio cleanup: private preview and new issue only, no TikTok upload.
# Owner-requested Instagram-only test: new private email review; publication requires separate explicit Instagram approval.
# Security: secrets are scoped to the render and email steps only (not pip installs).
# Owner-requested review verification with bundled FFmpeg and authorized-audio fallback; no auto-publish.
on:
  schedule:
    # GitHub starts every scheduled job of this repo 7-12 h late (19-25 Nov: SoundCloud
    # check 09:45 UTC → 17-21 h, statistics 15:00 → 23-02 h, Reel 08:00 → 19:16) and drops a
    # queued run when this file changes before it starts (22 + 23 Nov). So the slots are
    # early (02:17 and 05:47 Berlin, odd minutes — GitHub advises against the full hour):
    # with the usual delay the mail arrives during the day. The `guard` job keeps it to ONE
    # Reel per Berlin day. Always REVIEW, never auto-publish.
    - cron: '17 2 * * *'
      timezone: 'Europe/Berlin'
    - cron: '47 5 * * *'
      timezone: 'Europe/Berlin'
  # One-off, opt-in test run: editing this workflow starts a REAL approval email,
  # never a social publication. The rendered video still needs owner approval.
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = render only; review = create approval issue + Gmail mail'
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - review
      style:
        description: 'Cover style: auto = detect from cover; lana / rubin / night = force for this run'
        type: choice
        required: false
        default: auto
        options:
          - auto
          - lana
          - rubin
          - night
      song:
        description: 'Optional: one song for this run (part of the title or SoundCloud track id); empty = rotation'
        type: string
        required: false
        default: ''
concurrency:
  group: carlecool-daily-reel
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
  issues: write
jobs:
  guard:
    # Only a successful delivery step in a completed run counts; skipped jobs do not.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          skip=false
          day=$(TZ=Europe/Berlin date +%F)
          echo "date=$day" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "schedule" ]; then
            journal_result=$(python -c 'import sys; from carlecool.production_journal import check; print(check(sys.argv[1]))' "$day")
            if [ "$journal_result" = "True" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            since=$(date -u -d "$(TZ=Europe/Berlin date +%Y-%m-%d) 00:00 $(TZ=Europe/Berlin date +%z)" +%Y-%m-%dT%H:%M:%SZ)
            # The concurrency group serializes runs. Queued runs are not deliveries.
            # Include push-triggered review runs and exclude manual dry runs.
            # Inspect the actual delivery step rather than the aggregate conclusion.
            ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-reel.yml/runs?status=completed&created=%3E%3D${since}&per_page=100" \
              --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id")
            for id in $ids; do
              delivered=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "reel") | .steps[]? | select(.name == "Deliver private approval email" and .conclusion == "success")] | length')
              if echo "$delivered" | grep -q '[1-9]'; then
                skip=true; echo "Verified review delivery in run $id"; break
              fi
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  reel:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    # The user's own official SoundCloud podcast RSS feed and complete
    # no-publish preview-to-Gmail flow were verified with live GitHub Actions.
    # Human issue approval is still mandatory; publish secret stays disabled.
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # may wait up to 60 min for Coverr's hourly window (providers.py)
    # Only non-secret configuration here. Secrets are passed to the two steps that
    # use them, never to dependency installation steps.
    env:
      CARLECOOL_AI_VIDEO: ${{ vars.CARLECOOL_AI_VIDEO || 'multi' }}
      CARLECOOL_TRENDS: 'true'
      CARLECOOL_COVER_MATCH: 'true' # Creative v3: enable safe, local album-art palette ranking
      CARLECOOL_STYLE: ${{ inputs.style || vars.CARLECOOL_STYLE || 'auto' }}
      CARLECOOL_SONG: ${{ inputs.song || '' }}
      # Song pool override without a commit: repo variable CARLECOOL_SONG_POOL=all (see data/song-pool.json)
      CARLECOOL_SONG_POOL: ${{ vars.CARLECOOL_SONG_POOL || '' }}
      CARLECOOL_SEMANTIC: ${{ vars.CARLECOOL_SEMANTIC == 'off' && 'off' || 'on' }}
      SC_ALLOW_OFFICIAL_DOWNLOADS: ${{ vars.SC_ALLOW_OFFICIAL_DOWNLOADS }}
      AUDIO_S3_BUCKET: ${{ vars.AUDIO_S3_BUCKET }}
      STOCK_S3_BUCKET: ${{ vars.STOCK_S3_BUCKET }}
      AUDIO_S3_PREFIX: ${{ vars.AUDIO_S3_PREFIX }}
      MASTER_S3_BUCKET: ${{ vars.MASTER_S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'auto' }}
      APPROVAL_BASE_URL: ${{ vars.APPROVAL_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # History is written via the GitHub API; no git token on disk.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install portable FFmpeg and core Python dependencies (no apt)
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt 'imageio-ffmpeg==0.6.0'
          python scripts/setup_ffmpeg.py
      - name: Cache only public pretrained model weights (never artist media)
        if: ${{ vars.CARLECOOL_SEMANTIC != 'off' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub/checkpoints
          key: carlecool-public-openclip-v1-${{ runner.os }}
      - name: Optional free OpenCLIP model dependencies (safe fallback)
        if: ${{ vars.CARLECOOL_SEMANTIC != 'off' }}
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 1 --timeout 45 'open_clip_torch>=3,<4' 'Pillow>=10,<13'
      - name: Install optional AI video client
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CARLECOOL_AI_VIDEO:-off}" != "off" ]]; then
            timeout 240s python -m pip install --disable-pip-version-check --retries 2 --timeout 20 'gradio_client>=1.13,<3'
          else
            echo "Experimental AI client disabled; skipping installation"
          fi
      # Every scheduled run creates a NEW proposal, even when older reviews
      # remain open. Only an explicit owner approval can ever publish.
      - name: Render a balanced random Reel (no Instagram calls)
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          WIKIMEDIA_USER_AGENT: ${{ secrets.WIKIMEDIA_USER_AGENT || vars.WIKIMEDIA_USER_AGENT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_VIDEO_PUBLISH_LICENSE_CONFIRMED: ${{ secrets.AI_VIDEO_PUBLISH_LICENSE_CONFIRMED }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python -m carlecool.main --mode preview
      - name: Remember provider usage (also after a failed render)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m carlecool.providers
      - name: Deliver private approval email
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'review' }}
        env:
          CARLECOOL_PRODUCTION_DATE: ${{ github.event_name == 'schedule' && needs.guard.outputs.date || '' }}
          GH_TOKEN: ${{ github.token }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          APPROVAL_LINK_SECRET: ${{ secrets.APPROVAL_LINK_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python -m carlecool.review
      - name: Send private test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          APPROVAL_LINK_SECRET: ${{ secrets.APPROVAL_LINK_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python -m carlecool.review --dry-run-email
